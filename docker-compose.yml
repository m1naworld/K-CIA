version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kcia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kcia_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-kcia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kcia}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kcia}:${POSTGRES_PASSWORD:-kcia_local_pw}@db:5432/${POSTGRES_DB:-kcia}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kcia}:${POSTGRES_PASSWORD:-kcia_local_pw}@db:5432/${POSTGRES_DB:-kcia}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
    working_dir: /workspace
    profiles:
      - etl
    entrypoint: ["python", "-m"]
    command: ["etl.load_boundaries"]

volumes:
  pgdata:
